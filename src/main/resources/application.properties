spring.application.name=java-nao-e-lento-demo
server.port=8080

# Rodada: lento (gargalos 1 a 4) ou otimizado. O script rodada.sh/rodada.ps1 sobrescreve.
demo.modo=lento

# Platform threads por padrão; a rodada 2 liga virtual threads.
spring.threads.virtual.enabled=false
# Teto do gargalo 5: threads / latência (200 / 0,15 s ≈ 1.333 req/s).
# Num notebook, a CPU pode saturar antes desse teto; aí reduza com THREADS=50 no rodada.sh/ps1.
server.tomcat.threads.max=200

# Massa de dados gerada na memória (DadosEmMemoria) e espera simulada do serviço externo.
demo.clientes=2000
demo.pedidos-por-cliente=1000
demo.latencia-externa-ms=150
