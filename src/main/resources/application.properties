spring.application.name=java-nao-e-lento-demo
server.port=8080

# Rodada: lento (gargalos 1 a 4) ou otimizado. O script scripts/rodada.sh sobrescreve.
demo.modo=lento

# Platform threads por padrão; a rodada 2 liga virtual threads.
spring.threads.virtual.enabled=false
# 200 é o padrão do Tomcat; deixado explícito porque é o teto do gargalo 5.
server.tomcat.threads.max=200

# Serviço externo lento (scripts/ServicoExterno.java)
demo.externo.url=http://localhost:9090

spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=demo
spring.datasource.password=demo
spring.datasource.hikari.maximum-pool-size=200
