services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      # Roda só na primeira vez que o container é criado (2.000 clientes, 800 mil pedidos).
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
